services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: navalha
      POSTGRES_PASSWORD: navalha
      POSTGRES_DB: navalha_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U navalha -d navalha_test']
      interval: 2s
      timeout: 3s
      retries: 20
